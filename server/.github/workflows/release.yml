name: Release

# Push a tag like v0.2.0 to publish: one binary per platform, SHA256SUMS,
# release notes from the Conventional Commits since the last tag, and a
# multi-arch image on ghcr.io. The server's update check and one-click
# update read exactly these files (see the protocol's releases.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="geocrew-server-$os-$arch"; [ "$os" = windows ] && name="$name.exe"
            GOOS=$os GOARCH=$arch GOARM=7 CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=$version" -o "dist/$name" ./cmd/geocrew-server
          done
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          ./dist/geocrew-server-linux-amd64 -version | grep -F "$version"
      - name: Release notes
        run: .github/scripts/changelog.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: 同勘服务端 ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geocrew-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ !contains(github.ref_name, '-') && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
