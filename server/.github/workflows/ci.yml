name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The store contract also runs against PostgreSQL (throwaway, CI only).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      GEOCREW_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - run: go build ./cmd/geocrew-server

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: geocrew-server:ci
          build-args: VERSION=${{ github.sha }}
      - name: Smoke test
        run: |
          docker run -d --name geocrew -p 8080:8080 geocrew-server:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/v0/info
          curl -fsS -X POST localhost:8080/api/v0/workspaces -d '{"name":"ci","nickname":"bot"}'
          docker logs geocrew

  # The protocol repository's black-box checks, run against this build.
  conformance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GeoCrew-Dev/GeoCrew-Protocol
          path: protocol
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o geocrew-server ./cmd/geocrew-server
      - name: Run the protocol conformance checks
        run: |
          ./geocrew-server -addr 127.0.0.1:8080 -data "$RUNNER_TEMP/data" -push=false > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8080/healthz && break; sleep 1; done
          cd protocol/conformance && go run . -server http://127.0.0.1:8080 -v
      - name: Server log
        if: failure()
        run: cat server.log
