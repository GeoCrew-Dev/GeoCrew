services:
  geocrew:
    build: .
    image: geocrew-server:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GEOCREW_NAME: "GeoCrew Server"
      GEOCREW_MAX_UPLOAD_MB: "32"
      GEOCREW_LOG_FORMAT: "json"
    volumes:
      - geocrew-data:/data

volumes:
  geocrew-data:
