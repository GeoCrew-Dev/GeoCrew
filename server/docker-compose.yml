services:
  geocrew:
    # Released images; "docker compose pull && docker compose up -d" updates.
    # To run your own build instead: docker compose up -d --build
    image: ghcr.io/geocrew-dev/geocrew-server:${GEOCREW_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GEOCREW_NAME: "GeoCrew Server"
      GEOCREW_MAX_UPLOAD_MB: "32"
      GEOCREW_LOG_FORMAT: "json"
      # Daily backups into the volume below; point it at another disk in production.
      # GEOCREW_BACKUP_DIR: "/backups"
    volumes:
      - geocrew-data:/data
      # - ./backups:/backups

volumes:
  geocrew-data:
