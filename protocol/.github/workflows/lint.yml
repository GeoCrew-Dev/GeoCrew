name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GeoCrew-Dev/GeoCrew-Server
          path: server
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build the reference server
        run: cd server && go build -o ../geocrew-server ./cmd/geocrew-server
      - name: Run the conformance checks against it
        run: |
          ./geocrew-server -addr 127.0.0.1:8080 -data "$RUNNER_TEMP/data" -push=false > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8080/healthz && break; sleep 1; done
          cd conformance && go vet ./... && go run . -server http://127.0.0.1:8080 -v
      - name: Server log
        if: failure()
        run: cat server.log
