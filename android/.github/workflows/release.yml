name: Release

# Push a tag like v0.3.0 to publish geocrew-android-0.3.0.apk with its
# SHA256SUMS and release notes from the Conventional Commits since the last
# tag. The app's update check reads exactly these files.
#
# Signing uses four repository secrets the maintainer sets up once (see the
# README, 发布与签名): GEOCREW_KEYSTORE_BASE64, GEOCREW_KEYSTORE_PASSWORD,
# GEOCREW_KEY_ALIAS, GEOCREW_KEY_PASSWORD. Without them the release only
# carries an unsigned APK, which the app never offers as an update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.GEOCREW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GEOCREW_KEYSTORE_BASE64 is not set: publishing an unsigned APK that the app will not offer as an update."
          fi
      - name: Build
        env:
          GEOCREW_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          GEOCREW_KEYSTORE_PASSWORD: ${{ secrets.GEOCREW_KEYSTORE_PASSWORD }}
          GEOCREW_KEY_ALIAS: ${{ secrets.GEOCREW_KEY_ALIAS }}
          GEOCREW_KEY_PASSWORD: ${{ secrets.GEOCREW_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease -Pgeocrew.version="${GITHUB_REF_NAME#v}"
      - name: Collect
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/geocrew-android-$version.apk"
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$apksigner" verify --print-certs "dist/geocrew-android-$version.apk" | tee signer.txt
            {
              echo
              echo "安装包签名证书 SHA-256：\`$(grep -m1 'SHA-256' signer.txt | sed 's/.*: //')\`"
            } > signer.md
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/geocrew-android-$version-unsigned.apk"
            printf '\n本次没有配置签名密钥，附带的是未签名安装包，不能直接安装，应用内更新也不会提示。\n' > signer.md
          fi
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        run: |
          .github/scripts/changelog.sh "$GITHUB_REF_NAME" > notes.md
          cat signer.md >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: 同勘 ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
