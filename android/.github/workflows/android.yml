name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug test --continue
      # What the release workflow builds (unsigned here), so a tag never finds it broken.
      - name: Build release APK
        run: ./gradlew assembleRelease -Pgeocrew.version=0.0.1-ci.1
      - uses: actions/upload-artifact@v4
        with:
          name: geocrew-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # The network layer end to end against the reference server's latest code.
  server-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GeoCrew-Dev/GeoCrew-Server
          path: server
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the server
        run: |
          (cd server && go build -o "$RUNNER_TEMP/geocrew-server" ./cmd/geocrew-server)
          "$RUNNER_TEMP/geocrew-server" -addr 127.0.0.1:8080 -data "$RUNNER_TEMP/data" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Client against server
        env:
          GEOCREW_TEST_SERVER: http://127.0.0.1:8080
        run: ./gradlew :core:network:test --tests '*ServerIntegrationTest*'
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
