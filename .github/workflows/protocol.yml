name: Protocol

# The OpenAPI description must lint, and the reference server in server/
# must pass the black-box conformance checks in protocol/conformance.
on:
  push:
    branches: [main]
    paths: ["protocol/**", "server/**", ".github/workflows/protocol.yml"]
  pull_request:
    paths: ["protocol/**", "server/**", ".github/workflows/protocol.yml"]

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint OpenAPI
        working-directory: protocol
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build the reference server
        working-directory: server
        run: go build -o "$RUNNER_TEMP/geocrew-server" ./cmd/geocrew-server
      - name: Run the conformance checks against it
        run: |
          "$RUNNER_TEMP/geocrew-server" -addr 127.0.0.1:8080 -data "$RUNNER_TEMP/data" -push=false > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8080/healthz && break; sleep 1; done
          cd protocol/conformance && go vet ./... && go run . -server http://127.0.0.1:8080 -v
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
