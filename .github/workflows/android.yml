name: Android

# The Android client in android/ (ADR 0016): build it, run its unit tests and lint.
on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/testdata/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/testdata/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK, run the unit tests and lint
        run: ./gradlew assembleDebug test lintDebug --continue
      - uses: actions/upload-artifact@v4
        with:
          name: geocrew-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
