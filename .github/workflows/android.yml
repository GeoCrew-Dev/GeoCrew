name: Android

# The legacy app in android/ (frozen while the rewrite happens): build it,
# run its unit tests, and run its network layer against server/.
on:
  push:
    branches: [main]
    paths: ["android/**", "server/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "server/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug test --continue
      - name: Build release APK
        run: ./gradlew assembleRelease -Pgeocrew.version=0.0.1-ci.1
      - uses: actions/upload-artifact@v4
        with:
          name: geocrew-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  server-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the server
        run: |
          (cd server && go build -o "$RUNNER_TEMP/geocrew-server" ./cmd/geocrew-server)
          "$RUNNER_TEMP/geocrew-server" -addr 127.0.0.1:8080 -data "$RUNNER_TEMP/data" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Client against server
        working-directory: android
        env:
          GEOCREW_TEST_SERVER: http://127.0.0.1:8080
        run: ./gradlew :core:network:test --tests '*ServerIntegrationTest*'
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
