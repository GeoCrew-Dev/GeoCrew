name: Android

# The Android client in android/ (ADR 0016): build it, run its unit tests and lint.
on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/testdata/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/testdata/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch GeoCrew-Native's AAR (its CI artifact until it publishes releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-native.sh
      - name: Build the debug APK, run the unit tests and lint
        run: ./gradlew assembleDebug test lintDebug --continue
      - uses: actions/upload-artifact@v4
        with:
          name: geocrew-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # Tests that need the native library, on an emulator (ADR 0016), as GeoCrew-Native does.
  device:
    name: instrumented tests (API 31)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch GeoCrew-Native's AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-native.sh
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew :storage:connectedDebugAndroidTest
