name: Server

on:
  push:
    branches: [main]
    paths: ["server/**", "protocol/testdata/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "protocol/testdata/**", ".github/workflows/server.yml"]

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    # The store contract also runs against PostgreSQL (throwaway, CI only).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      GEOCREW_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - run: go build ./cmd/geocrew-server

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          load: true
          tags: geocrew-server:ci
          build-args: VERSION=${{ github.sha }}
      - name: Smoke test
        run: |
          docker run -d --name geocrew -p 8080:8080 geocrew-server:ci
          # HTTPS with its own certificate by default (ADR 0014); -k as the phones pin the key instead.
          for i in $(seq 1 20); do curl -fsSk https://localhost:8080/healthz && break; sleep 1; done
          curl -fsSk https://localhost:8080/api/v0/info
          curl -fsSk -X POST https://localhost:8080/api/v0/workspaces -d '{"name":"ci","nickname":"bot"}'
          docker logs geocrew 2>&1 | grep -q 'fingerprint='
          docker logs geocrew
